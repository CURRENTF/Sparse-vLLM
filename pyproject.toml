[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparsevllm"
version = "0.1.0"
description = "A sparse-first inference engine for long-context LLM serving"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Sparse-vLLM Team"}
]
dependencies = [
    "fire",
    "transformers>=5.13,<6",
    "socksio>=1,<2",
    "ninja",
    "triton>=3.5,<4",
    "tilelang==0.1.9",
    "apache-tvm-ffi==0.1.10",
    "nvidia-cutlass-dsl>=4.6,<5",
    "pillow",
    "torchvision",
    "einops",
    "sglang-kernel>=0.4.5,<0.4.6",
    "tqdm",
    "loguru",
    "fastapi>=0.100",
    "uvicorn[standard]",
    "pydantic>=2",
    "accelerate",
    "datasets",
    "wandb",
    "bitsandbytes",
    "datatrove",
    "matplotlib",
    "seaborn",
    "math-verify==0.9.0",
    "fuzzywuzzy",
    "jieba",
    "pytest",
    "rouge",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
cu129 = [
    "torch==2.11.0",
    "flashinfer-python[cu12]>=0.6.15,<0.7",
    "flashinfer-jit-cache>=0.6.15,<0.7",
]
cu130 = [
    "torch==2.11.0",
    "flashinfer-python[cu13]>=0.6.15,<0.7",
    "flashinfer-jit-cache>=0.6.15,<0.7",
]

[project.scripts]
sparsevllm-openai-server = "sparsevllm.entrypoints.openai.api_server:main"
sparsevllm-openai-router = "sparsevllm.entrypoints.openai.smart_router:main"
sparsevllm-openai-client = "sparsevllm.entrypoints.openai.client:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sparsevllm*"]

[tool.setuptools.package-data]
sparsevllm = [
    "kernels/triton/profiles/*.json",
    "operators/profiles/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
conflicts = [
    [
        { extra = "cu129" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu129", extra = "cu129" },
    { index = "pytorch-cu130", extra = "cu130" },
]
flashinfer-jit-cache = [
    { index = "flashinfer-cu129", extra = "cu129" },
    { index = "flashinfer-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "flashinfer-cu129"
url = "https://flashinfer.ai/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "flashinfer-cu130"
url = "https://flashinfer.ai/whl/cu130"
explicit = true
