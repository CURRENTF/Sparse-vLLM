[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparsevllm"
version = "0.1.0"
description = "A sparse-first inference engine for long-context LLM serving"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Sparse-vLLM Team"}
]
dependencies = [
    "fire",
    "torch>=2.9,<3",
    "transformers>=5.13,<6",
    "socksio>=1,<2",
    "triton>=3.5,<4",
    "tilelang==0.1.9",
    "apache-tvm-ffi==0.1.10",
    "pillow",
    "einops",
    "sgl-kernel>=0.3.21,<0.4",
    "tqdm",
    "loguru",
    "fastapi>=0.100",
    "uvicorn[standard]",
    "pydantic>=2",
    "flashinfer-python>=0.6.15,<0.7",
    "flashinfer-jit-cache>=0.6.15,<0.7",
    "accelerate",
    "datasets",
    "wandb",
    "bitsandbytes",
    "datatrove",
    "matplotlib",
    "seaborn",
    "math-verify==0.9.0",
    "fuzzywuzzy",
    "jieba",
    "pytest",
    "rouge",
    "tomli; python_version < '3.11'",
]

[project.scripts]
sparsevllm-openai-server = "sparsevllm.entrypoints.openai.api_server:main"
sparsevllm-openai-router = "sparsevllm.entrypoints.openai.smart_router:main"
sparsevllm-openai-client = "sparsevllm.entrypoints.openai.client:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sparsevllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
